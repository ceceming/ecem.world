<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ecem.world — cv</title>
<meta name="description" content="Ecem Ozturk — Art Director. Curriculum vitae.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

  html, body { margin: 0; background: #000; }

  body {
    font-family: Helvetica, "Helvetica Neue", "HelveticaNeue", Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    /* Room at the foot so the last page clears the button that floats there. */
    padding: 0 20px calc(110px + env(safe-area-inset-bottom));
  }

  /* ── Top bar ─────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding: 26px 0 22px;
    font-size: clamp(11px, 2.4vmin, 13px);
    letter-spacing: 0.22em;
  }

  header a { color: inherit; text-decoration: none; opacity: 0.55; transition: opacity 220ms ease; }
  header a:hover, header a:focus-visible { opacity: 1; }
  header .here { opacity: 0.85; }

  /* ── The pages ───────────────────────────────────────────────────── */
  .pages {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .pages img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    /* Paper lifted off the dark, rather than a white box stuck to it. */
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.8);
  }

  /* ── Take a copy ─────────────────────────────────────────────────── */
  /* Fixed, so it is in reach whether you read a line or the whole thing. */
  .take {
    position: fixed;
    left: 50%;
    bottom: max(26px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    background: #faf8f4;
    color: #111;
    font-size: clamp(11px, 2.4vmin, 13px);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-decoration: none;
    white-space: nowrap;
    /* It floats over white paper as often as over black, so it carries its
       own edge rather than relying on a scrim that would dim the CV. */
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22),
                0 10px 28px rgba(0, 0, 0, 0.55);
    transition: transform 240ms cubic-bezier(.22,.61,.36,1), box-shadow 240ms ease;
  }

  .take:hover, .take:focus-visible {
    transform: translateX(-50%) translateY(-3px);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3),
                0 18px 36px rgba(0, 0, 0, 0.7);
    outline: none;
  }

  .take:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .take:active { transform: translateX(-50%) translateY(0); transition-duration: 80ms; }

  .take svg { flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .take, header a { transition: none; }
  }
</style>
</head>
<body>

<header>
  <a href="../">← ecem.world</a>
  <span class="here">art director · cv</span>
</header>

<main class="pages">
  <img src="../assets/cv-page-1.webp" width="1496" height="1936"
       alt="Ecem Ozturk, Art Director — curriculum vitae, page one: contact details, summary, core skills, and professional experience."
       decoding="async">
  <img src="../assets/cv-page-2.webp" width="1496" height="1936"
       alt="Curriculum vitae, page two: remaining professional experience, education and certifications."
       loading="lazy" decoding="async">
</main>

<a class="take" href="../assets/ecem-ozturk-cv.pdf" download="Ecem-Ozturk-CV-2026.pdf">
  take a copy
  <svg width="12" height="13" viewBox="0 0 12 13" fill="none" aria-hidden="true">
    <path d="M6 0v9M2.5 5.5L6 9l3.5-3.5M0 12.5h12" stroke="currentColor" stroke-width="1.3"/>
  </svg>
</a>

</body>
</html>

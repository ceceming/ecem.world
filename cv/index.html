<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..700;1,300..700&display=swap">
<title>ecem.world — cv</title>
<meta name="description" content="Ecem Ozturk — Designer &amp; Art Director. Curriculum vitae.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

  html, body { margin: 0; background: #000; }

  /* Everything that is not the paper is a way back, so the dark says so.
     There is no built-in "back" cursor, hence the inlined arrow; the keyword
     after it is the fallback wherever a custom cursor is refused. */
  body {
    cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACl0lEQVR42u1XTUhUURg99747jiFOSFqtKhczFVQMYoQtxEUtXbkTjBbpQmbROgxyUWokZbQ0ERICXc3CRQjubKUbQQicRat5Q4SpjTD63r2nRXfsNc5oP86zwAN387jwnfPdc757H3CM/xziSAtLKQHACb04SSGEAIC70Wj0QpjdECQFSQkgNTw8/JHkRQCw36oKKaVEX19fBMCD8fHxLL8jFALSnncMwON0Ov2ZJD3P04VCoeoEpOM4AHCqoaHh5fz8/Fdb3ITRAccWPxuPx98sLi7mi8r5A1Uj4CilACDe0tIys7q6WiDJnZ0dQ7Konpubm5cBSOsN54D128WvdnR0zLquq0vabgIdOK+UQk1NDZRSFZeN7R6ocsUjkYj2PO96V1fX84mJiZuxWAxaayqlhG13cQ4gmUz2+L6ftQq5j6gIgLcA1u3MYLnhIaSUNMbc6u/vfzo6Opqsra2F1hqO4+zuJbmraGpqKru2trYNQJKV64+MjGRc170jhMiSFOXIiunpaUdK2TM0NPTBGEOSRuug3/4cbW1tswBO2zjvivnJuSsrKwLAycbGxnohBIwxrHR2h4WgBzg4OKillK96e3tzuVzuycDAQNx2QljmezA3N/cln897JPc9Atd1TwBQpXtEhQRo3/dvp1KpZ2NjY9esLyClFKUeaG1tfbi0tJS1YniA2D0mPCiGN7q7u99vbW2RpPF9v1wMz/1NDH+FxJXOzs53ruuawCyo+iAqJdHc3t4+k8lkvDBHcSmJM4lE4vXy8vJ2mJdR6aVU39TU9GJhYSF4KYX7IAEQraure5ROp9dJcmNjIzQCQRKOlPL+5OTkJ5KXwiQAACIQqXuJRKL5KJ7oQghRzHboz/J/4sfkGIeGb43VDs7S/yilAAAAAElFTkSuQmCC") 16 16, pointer;
  }

  /* Over the paper itself, nothing is clickable — an ordinary pointer. */
  .pages img { cursor: default; }

  /* Links keep the hand that says "this does its own thing". */
  a { cursor: pointer; }

  body {
    font-family: "Jost", Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    padding: 0 20px 40px;
  }

  /* ── Top bar ─────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding: 26px 0 22px;
    font-size: clamp(11px, 2.4vmin, 13px);
    letter-spacing: 0.22em;
  }

  header .here { opacity: 0.85; }

  /* Not a button pretending to be text — a real one, so it is tabbable and
     answers Enter. It happens to look like the instruction it is. */
  .hint {
    appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 0.5;
    transition: opacity 220ms ease;
  }

  .hint:hover, .hint:focus-visible { opacity: 0.9; }
  .hint:focus-visible { outline: 1px solid rgba(255,255,255,0.6); outline-offset: 6px; }

  /* On a pointer device the sentence is the whole control. */
  .hint .arrow, .hint .short { display: none; }

  /* ── The pages ───────────────────────────────────────────────────── */
  .pages {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .page { position: relative; }

  .pages img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    /* Paper lifted off the dark, rather than a white box stuck to it. */
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.8);
  }

  /* ── Live links over the paper ───────────────────────────────────────
     The pages are flat images, so the PDF's own hyperlinks do not survive
     onto the site. These sit on top of them, placed from the rectangles the
     build reads back out of the PDF (assets/cv-links.json) — so they move
     when the layout moves and cannot drift out of register by hand.

     The underline is already drawn on the paper underneath. These add the
     behaviour, not a second set of marks. */
  .hot {
    position: absolute;
    display: block;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: transparent;              /* the words are in the image below */
    text-decoration: none;
    cursor: pointer;
    border-radius: 2px;
    transition: background-color 160ms ease;
  }

  /* The link rectangles are about 10pt tall — roughly 23px at full width and
     half that on a phone, well under a thumb. This grows the target without
     moving the highlight. Horizontal growth stays small: the three links sit
     close together and must not overlap each other. */
  .hot::after {
    content: "";
    position: absolute;
    inset: -13px -4px;
  }

  /* Hover is scoped to devices that actually have a pointer. Left unscoped,
     a tapped element on a touch screen keeps :hover until something else is
     tapped — so the caption would stay parked over her name after a copy,
     which is the exact thing the press-to-reveal behaviour avoids. */
  @media (hover: hover) {
    .hot:hover { background: rgba(0, 0, 0, 0.1); }
  }

  .hot:focus-visible {
    background: rgba(0, 0, 0, 0.1);
    outline: none;
    box-shadow: 0 0 0 2px #000;
  }

  /* ── What each one does, said before it is pressed ───────────────── */
  .tip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 9px);
    transform: translateX(-50%);
    z-index: 4;
    padding: 5px 9px;
    border-radius: 4px;
    background: #15151a;
    color: #fff;
    font-size: 11px;
    letter-spacing: 0.07em;
    line-height: 1.3;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 160ms ease;
  }

  /* The little nib pointing down at the link. */
  .tip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -4px;
    border: 4px solid transparent;
    border-top-color: #15151a;
  }

  .hot:focus-visible .tip,
  .tip.is-shown { opacity: 1; }

  @media (hover: hover) {
    .hot:hover .tip { opacity: 1; }
  }

  /* Confirmation reuses the same bubble rather than throwing a toast
     somewhere else on the screen. */
  .tip.is-done { background: #1f6f3f; }
  .tip.is-done::after { border-top-color: #1f6f3f; }

  @media (hover: none) {
    /* No hover here, so two things change.

       The targets have to advertise themselves, since nothing will reveal
       them on approach.

       And the caption cannot simply be left up. The page image scales down
       with the window but a legible bubble does not, so at phone width a
       permanent one is wider than the whole contact line and sits across
       her name. It is shown on finger-down instead (see the script): you
       read "click to copy" while pressing, and "copied" when you lift. */
    .hot { background: rgba(0, 0, 0, 0.07); }
    .hot::after { inset: -15px -5px; }

    .tip {
      font-size: 10px;
      padding: 4px 8px;
      letter-spacing: 0.04em;
    }
  }

  /* ── Take a copy ─────────────────────────────────────────────────── */
  /* Clipped to the paper's own top corner, the way a note left on a document
     is — not parked at the edge of the window. Sticky, so it rides down with
     you instead of scrolling out of reach on a CV this long. */
  .take {
    position: sticky;
    top: 18px;
    z-index: 3;
    align-self: flex-end;
    /* Hangs just off the right edge, and takes up no vertical space of its
       own so the first page still starts at the top. */
    margin-right: -12px;
    /* Its own height plus the column gap, so the page rises to meet it, then
       a little back so the tag straddles the paper's top edge rather than
       hovering above it. */
    margin-bottom: -43px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: #faf8f4;
    color: #111;
    font-size: clamp(11px, 2.4vmin, 13px);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-decoration: none;
    white-space: nowrap;
    transform: rotate(2.5deg);
    /* Its own edge, so it reads over white paper as well as over black. */
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22), 0 8px 22px rgba(0, 0, 0, 0.5);
    transition: transform 240ms cubic-bezier(.22,.61,.36,1), box-shadow 240ms ease;
  }

  .take:hover, .take:focus-visible {
    transform: rotate(0deg) translateY(-2px);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 14px 30px rgba(0, 0, 0, 0.65);
    outline: none;
  }

  .take:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .take:active { transform: rotate(0deg) translateY(0); transition-duration: 80ms; }
  .take svg { flex: none; }

  /* ── Touch ───────────────────────────────────────────────────────────
     Two things change on a touch screen.

     The note on the top corner is the one place a thumb cannot comfortably
     go, so take-a-copy moves into the thumb's arc at the bottom.

     And "click anywhere" stops being true. Measured on a real layout, the
     background is 36% of a 1280px desktop window — spread round the edges,
     where a backdrop is expected — but only 19% of an iPhone 13 and 11% of
     an iPad, in strips too narrow to aim at. So on touch the sentence
     becomes an ordinary back button beside it, and tapping the background
     stops doing anything, which also means no more ejecting yourself
     mid-read with a stray tap near the edge.

     The two sit in a row: [back] [take a copy], centred together. */
  @media (hover: none) {
    :root {
      --bar-back: 92px;
      --bar-take: 190px;
      --bar-gap: 8px;
      --bar-total: calc(var(--bar-back) + var(--bar-gap) + var(--bar-take));
    }

    body { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }

    .hint .label { display: none; }
    .hint .arrow, .hint .short { display: inline; }

    .hint {
      position: fixed;
      z-index: 3;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: calc(50% - var(--bar-total) / 2);
      width: var(--bar-back);
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      /* Its own fill and hairline, so it reads over black and over paper. */
      background: #15151a;
      color: #fff;
      opacity: 1;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.32), 0 10px 30px rgba(0, 0, 0, 0.7);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .hint:active { transform: scale(0.97); background: #24242b; }
    .hint:hover, .hint:focus-visible { opacity: 1; }

    .take {
      position: fixed;
      top: auto;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: calc(50% - var(--bar-total) / 2 + var(--bar-back) + var(--bar-gap));
      right: auto;
      margin: 0;
      width: var(--bar-take);
      transform: none;
      /* Comfortably past the 44px minimum. */
      min-height: 54px;
      justify-content: center;
      padding: 16px 28px;
      font-size: 13px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22), 0 10px 30px rgba(0, 0, 0, 0.7);
      /* No hover to telegraph the press, so the press itself answers. */
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .take:hover, .take:focus-visible { transform: none; }
    .take:active { transform: scale(0.97); background: #ece8e0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .take, header a { transition: none; }
  }
</style>
</head>
<body>

<header>
  <button type="button" class="hint" id="back">
    <svg class="arrow" width="12" height="11" viewBox="0 0 12 11" fill="none" aria-hidden="true">
      <path d="M11 5.5H1M5 1L1 5.5 5 10" stroke="currentColor" stroke-width="1.3"/>
    </svg><span class="label">[&nbsp;click anywhere to go back&nbsp;]</span><span class="short">back</span>
  </button>
  <span class="here">designer &amp; art director · cv</span>
</header>

<main class="pages">
  <a class="take" href="../assets/ecem-ozturk-cv.pdf?v=20261015e" download="Ecem-Ozturk-CV-2026.pdf">
    take a copy
    <svg width="12" height="13" viewBox="0 0 12 13" fill="none" aria-hidden="true">
      <path d="M6 0v9M2.5 5.5L6 9l3.5-3.5M0 12.5h12" stroke="currentColor" stroke-width="1.3"/>
    </svg>
  </a>
  <div class="page" data-page="1">
    <img src="../assets/cv-page-1.webp?v=20261015e" width="1500" height="1942"
         alt="Ecem Ozturk, Designer &amp; Art Director — curriculum vitae, page one: contact details, summary, core skills, and professional experience."
         decoding="async">
  </div>
  <div class="page" data-page="2">
    <img src="../assets/cv-page-2.webp?v=20261015e" width="1500" height="1942"
         alt="Curriculum vitae, page two: remaining professional experience, education and certifications."
         loading="lazy" decoding="async">
  </div>
</main>


<script>
  /* The whole dark field is a way back: click any of it and you return to the
   * landing page. The paper, the links and the header are excluded — and so
   * are the things that only look like clicks. */
  (function () {
    const HOME = '../';
    let startX = 0, startY = 0;

    addEventListener('pointerdown', (event) => {
      startX = event.clientX;
      startY = event.clientY;
    }, { passive: true });

    addEventListener('click', (event) => {
      // On touch the background is too small a target to aim at, and the
      // back button covers it — so a stray tap near an edge while reading
      // must not throw you off the page.
      if (matchMedia('(hover: none)').matches) return;

      // Otherwise only the paper and the real controls are exempt.
      if (event.target.closest('img, a, button')) return;

      // Finishing a text selection is not a click, nor is the end of a drag
      // or a flick-scroll that happens to land on the background.
      const selection = window.getSelection();
      if (selection && selection.toString().trim()) return;
      if (Math.hypot(event.clientX - startX, event.clientY - startY) > 8) return;

      location.href = HOME;
    });

    const hint = document.getElementById('back');
    if (hint) hint.addEventListener('click', () => { location.href = HOME; });

    // The keyboard equivalent of clicking away, for anyone who cannot.
    addEventListener('keydown', (event) => {
      if (event.key === 'Escape') location.href = HOME;
    });
  })();
</script>

<script>
  /* Live links laid over the paper.
   *
   * The pages are flat images, so a reader who never downloads the PDF has no
   * working links at all. These overlays restore them, positioned from
   * assets/cv-links.json — rectangles the build reads back out of the PDF it
   * just produced, as percentages, so they track the layout instead of being
   * measured off the picture by hand.
   *
   * The email is the odd one out: it copies rather than opening a mail app,
   * which nobody can guess from looking at it, so it says so first.
   *
   * If any of this fails the page is exactly what it was before — an image of
   * a CV and a download button.
   */
  (function () {
    const COPIED_FOR = 1800;   // ms the confirmation stays up

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (err) { /* fall through to the old way */ }

      // Pre-clipboard-API browsers, and anything that refuses the promise.
      try {
        const field = document.createElement('textarea');
        field.value = text;
        field.setAttribute('readonly', '');
        field.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
        document.body.appendChild(field);
        field.select();
        field.setSelectionRange(0, text.length);   // iOS needs the range
        const ok = document.execCommand('copy');
        field.remove();
        return ok;
      } catch (err) {
        return false;
      }
    }

    function hotspot(link) {
      const isCopy = link.kind === 'copy';
      const el = document.createElement(isCopy ? 'button' : 'a');

      el.className = 'hot';
      el.dataset.kind = link.kind;
      el.style.left = link.left + '%';
      el.style.top = link.top + '%';
      el.style.width = link.width + '%';
      el.style.height = link.height + '%';

      const tip = document.createElement('span');
      tip.className = 'tip';
      el.appendChild(tip);

      if (isCopy) {
        el.type = 'button';
        tip.textContent = 'click to copy';
        el.setAttribute('aria-label', 'Copy email address ' + link.value);

        // Touch has no hover, so the caption rides the press: it comes up
        // under the finger before the tap completes, which is the only
        // moment left to say what this does. A permanent one is not an
        // option — at phone width the bubble is wider than the contact line
        // it describes.
        el.addEventListener('pointerdown', (event) => {
          if (event.pointerType === 'mouse') return;   // hover already covers it
          clearTimeout(el._reset);
          tip.textContent = 'click to copy';
          tip.classList.remove('is-done');
          tip.classList.add('is-shown');
        });

        // If the finger slides off without lifting, nothing was copied, so
        // the caption should not linger.
        for (const ending of ['pointercancel', 'pointerleave']) {
          el.addEventListener(ending, () => {
            if (!tip.classList.contains('is-done')) tip.classList.remove('is-shown');
          });
        }

        el.addEventListener('click', async (event) => {
          event.preventDefault();
          const ok = await copyText(link.value);

          if (!ok) {
            // Never a dead button: if the clipboard is unavailable, do the
            // thing the address would have done anyway.
            location.href = 'mailto:' + link.value;
            return;
          }

          tip.textContent = 'copied ' + link.value;
          tip.classList.add('is-done', 'is-shown');
          clearTimeout(el._reset);
          el._reset = setTimeout(() => {
            tip.textContent = 'click to copy';
            tip.classList.remove('is-done', 'is-shown');
          }, COPIED_FOR);
        });
      } else {
        el.href = link.value;
        el.target = '_blank';
        el.rel = 'noopener noreferrer';
        // The destination, not the word on the page — worth knowing before
        // following it, and the paper underneath already shows the word.
        // Decoded, or her LinkedIn reads as "ecem-%C3%B6zt%C3%BCrk".
        let shown = link.value.replace(/^https?:\/\//, '').replace(/\/$/, '');
        try { shown = decodeURIComponent(shown); } catch (err) { /* keep raw */ }
        tip.textContent = shown;
        el.setAttribute('aria-label', link.label + ' — opens in a new tab');
      }

      return el;
    }

    fetch('../assets/cv-links.json', { cache: 'no-cache' })
      .then((response) => (response.ok ? response.json() : Promise.reject(response.status)))
      .then((links) => {
        for (const link of links) {
          const page = document.querySelector(`.page[data-page="${link.page}"]`);
          if (page) page.appendChild(hotspot(link));
        }
      })
      .catch((err) => {
        // Worth saying out loud, because nothing visible goes wrong: the
        // links simply stay as printed pixels.
        console.warn('CV link overlays unavailable:', err);
      });
  })();
</script>

</body>
</html>

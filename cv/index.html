<html lang="en">
<head>
<meta charset="utf-8">

<title>ecem.world — cv</title>
<meta name="description" content="Ecem Ozturk — Art Director. Curriculum vitae.">
<meta name="theme-color" content="#000000">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

  html, body { margin: 0; background: #000; }

  /* Everything that is not the paper is a way back, so the dark says so.
     There is no built-in "back" cursor, hence the inlined arrow; the keyword
     after it is the fallback wherever a custom cursor is refused. */
  body {
    cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACl0lEQVR42u1XTUhUURg99747jiFOSFqtKhczFVQMYoQtxEUtXbkTjBbpQmbROgxyUWokZbQ0ERICXc3CRQjubKUbQQicRat5Q4SpjTD63r2nRXfsNc5oP86zwAN387jwnfPdc757H3CM/xziSAtLKQHACb04SSGEAIC70Wj0QpjdECQFSQkgNTw8/JHkRQCw36oKKaVEX19fBMCD8fHxLL8jFALSnncMwON0Ov2ZJD3P04VCoeoEpOM4AHCqoaHh5fz8/Fdb3ITRAccWPxuPx98sLi7mi8r5A1Uj4CilACDe0tIys7q6WiDJnZ0dQ7Konpubm5cBSOsN54D128WvdnR0zLquq0vabgIdOK+UQk1NDZRSFZeN7R6ocsUjkYj2PO96V1fX84mJiZuxWAxaayqlhG13cQ4gmUz2+L6ftQq5j6gIgLcA1u3MYLnhIaSUNMbc6u/vfzo6Opqsra2F1hqO4+zuJbmraGpqKru2trYNQJKV64+MjGRc170jhMiSFOXIiunpaUdK2TM0NPTBGEOSRuug3/4cbW1tswBO2zjvivnJuSsrKwLAycbGxnohBIwxrHR2h4WgBzg4OKillK96e3tzuVzuycDAQNx2QljmezA3N/cln897JPc9Atd1TwBQpXtEhQRo3/dvp1KpZ2NjY9esLyClFKUeaG1tfbi0tJS1YniA2D0mPCiGN7q7u99vbW2RpPF9v1wMz/1NDH+FxJXOzs53ruuawCyo+iAqJdHc3t4+k8lkvDBHcSmJM4lE4vXy8vJ2mJdR6aVU39TU9GJhYSF4KYX7IAEQraure5ROp9dJcmNjIzQCQRKOlPL+5OTkJ5KXwiQAACIQqXuJRKL5KJ7oQghRzHboz/J/4sfkGIeGb43VDs7S/yilAAAAAElFTkSuQmCC") 16 16, pointer;
  }

  /* Over the paper itself, nothing is clickable — an ordinary pointer. */
  .pages img { cursor: default; }

  /* Links keep the hand that says "this does its own thing". */
  a { cursor: pointer; }

  body {
    font-family: Helvetica, "Helvetica Neue", "HelveticaNeue", Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    padding: 0 20px 40px;
  }

  /* ── Top bar ─────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding: 26px 0 22px;
    font-size: clamp(11px, 2.4vmin, 13px);
    letter-spacing: 0.22em;
  }

  header .here { opacity: 0.85; }

  /* Not a button pretending to be text — a real one, so it is tabbable and
     answers Enter. It happens to look like the instruction it is. */
  .hint {
    appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 0.5;
    transition: opacity 220ms ease;
  }

  .hint:hover, .hint:focus-visible { opacity: 0.9; }
  .hint:focus-visible { outline: 1px solid rgba(255,255,255,0.6); outline-offset: 6px; }

  /* On a pointer device the sentence is the whole control. */
  .hint .arrow, .hint .short { display: none; }

  /* ── The pages ───────────────────────────────────────────────────── */
  .pages {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .pages img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    /* Paper lifted off the dark, rather than a white box stuck to it. */
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.8);
  }

  /* ── Take a copy ─────────────────────────────────────────────────── */
  /* Clipped to the paper's own top corner, the way a note left on a document
     is — not parked at the edge of the window. Sticky, so it rides down with
     you instead of scrolling out of reach on a CV this long. */
  .take {
    position: sticky;
    top: 18px;
    z-index: 3;
    align-self: flex-end;
    /* Hangs just off the right edge, and takes up no vertical space of its
       own so the first page still starts at the top. */
    margin-right: -12px;
    /* Its own height plus the column gap, so the page rises to meet it, then
       a little back so the tag straddles the paper's top edge rather than
       hovering above it. */
    margin-bottom: -43px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: #faf8f4;
    color: #111;
    font-size: clamp(11px, 2.4vmin, 13px);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-decoration: none;
    white-space: nowrap;
    transform: rotate(2.5deg);
    /* Its own edge, so it reads over white paper as well as over black. */
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22), 0 8px 22px rgba(0, 0, 0, 0.5);
    transition: transform 240ms cubic-bezier(.22,.61,.36,1), box-shadow 240ms ease;
  }

  .take:hover, .take:focus-visible {
    transform: rotate(0deg) translateY(-2px);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 14px 30px rgba(0, 0, 0, 0.65);
    outline: none;
  }

  .take:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .take:active { transform: rotate(0deg) translateY(0); transition-duration: 80ms; }
  .take svg { flex: none; }

  /* ── Touch ───────────────────────────────────────────────────────────
     Two things change on a touch screen.

     The note on the top corner is the one place a thumb cannot comfortably
     go, so take-a-copy moves into the thumb's arc at the bottom.

     And "click anywhere" stops being true. Measured on a real layout, the
     background is 36% of a 1280px desktop window — spread round the edges,
     where a backdrop is expected — but only 19% of an iPhone 13 and 11% of
     an iPad, in strips too narrow to aim at. So on touch the sentence
     becomes an ordinary back button beside it, and tapping the background
     stops doing anything, which also means no more ejecting yourself
     mid-read with a stray tap near the edge.

     The two sit in a row: [back] [take a copy], centred together. */
  @media (hover: none) {
    :root {
      --bar-back: 92px;
      --bar-take: 190px;
      --bar-gap: 8px;
      --bar-total: calc(var(--bar-back) + var(--bar-gap) + var(--bar-take));
    }

    body { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }

    .hint .label { display: none; }
    .hint .arrow, .hint .short { display: inline; }

    .hint {
      position: fixed;
      z-index: 3;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: calc(50% - var(--bar-total) / 2);
      width: var(--bar-back);
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      /* Its own fill and hairline, so it reads over black and over paper. */
      background: #15151a;
      color: #fff;
      opacity: 1;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.32), 0 10px 30px rgba(0, 0, 0, 0.7);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .hint:active { transform: scale(0.97); background: #24242b; }
    .hint:hover, .hint:focus-visible { opacity: 1; }

    .take {
      position: fixed;
      top: auto;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: calc(50% - var(--bar-total) / 2 + var(--bar-back) + var(--bar-gap));
      right: auto;
      margin: 0;
      width: var(--bar-take);
      transform: none;
      /* Comfortably past the 44px minimum. */
      min-height: 54px;
      justify-content: center;
      padding: 16px 28px;
      font-size: 13px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22), 0 10px 30px rgba(0, 0, 0, 0.7);
      /* No hover to telegraph the press, so the press itself answers. */
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .take:hover, .take:focus-visible { transform: none; }
    .take:active { transform: scale(0.97); background: #ece8e0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .take, header a { transition: none; }
  }
</style>
</head>
<body>

<header>
  <button type="button" class="hint" id="back">
    <svg class="arrow" width="12" height="11" viewBox="0 0 12 11" fill="none" aria-hidden="true">
      <path d="M11 5.5H1M5 1L1 5.5 5 10" stroke="currentColor" stroke-width="1.3"/>
    </svg><span class="label">[&nbsp;click anywhere to go back&nbsp;]</span><span class="short">back</span>
  </button>
  <span class="here">art director · cv</span>
</header>

<main class="pages">
  <a class="take" href="../assets/ecem-ozturk-cv.pdf" download="Ecem-Ozturk-CV-2026.pdf">
    take a copy
    <svg width="12" height="13" viewBox="0 0 12 13" fill="none" aria-hidden="true">
      <path d="M6 0v9M2.5 5.5L6 9l3.5-3.5M0 12.5h12" stroke="currentColor" stroke-width="1.3"/>
    </svg>
  </a>
  <img src="../assets/cv-page-1.webp" width="1500" height="1942"
       alt="Ecem Ozturk, Art Director — curriculum vitae, page one: contact details, summary, core skills, and professional experience."
       decoding="async">
  <img src="../assets/cv-page-2.webp" width="1500" height="1942"
       alt="Curriculum vitae, page two: remaining professional experience, education and certifications."
       loading="lazy" decoding="async">
</main>


<script>
  /* The whole dark field is a way back: click any of it and you return to the
   * landing page. The paper, the links and the header are excluded — and so
   * are the things that only look like clicks. */
  (function () {
    const HOME = '../';
    let startX = 0, startY = 0;

    addEventListener('pointerdown', (event) => {
      startX = event.clientX;
      startY = event.clientY;
    }, { passive: true });

    addEventListener('click', (event) => {
      // On touch the background is too small a target to aim at, and the
      // back button covers it — so a stray tap near an edge while reading
      // must not throw you off the page.
      if (matchMedia('(hover: none)').matches) return;

      // Otherwise only the paper and the real controls are exempt.
      if (event.target.closest('img, a, button')) return;

      // Finishing a text selection is not a click, nor is the end of a drag
      // or a flick-scroll that happens to land on the background.
      const selection = window.getSelection();
      if (selection && selection.toString().trim()) return;
      if (Math.hypot(event.clientX - startX, event.clientY - startY) > 8) return;

      location.href = HOME;
    });

    const hint = document.getElementById('back');
    if (hint) hint.addEventListener('click', () => { location.href = HOME; });

    // The keyboard equivalent of clicking away, for anyone who cannot.
    addEventListener('keydown', (event) => {
      if (event.key === 'Escape') location.href = HOME;
    });
  })();
</script>

</body>

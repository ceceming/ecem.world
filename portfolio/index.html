<!-- The opening (see "The opening" in site.css): once per browser tab, and
     not when arriving on a project's link or in the studio's preview. If the
     script below never runs, the page simply shows as normal. -->
<script>
  // Arriving from the home page's [ PORTFOLIO ]: the logo is already in its
  // corner; the rest of the page fades in around it.
  (function () {
    try {
      if (!sessionStorage.getItem('ecem.world:arrive')) return;
      sessionStorage.removeItem('ecem.world:arrive');
    } catch (err) { return; }
    var root = document.documentElement;
    root.classList.add('arrive');
    // Don't wait for the page's scripts: start fading in almost at once.
    setTimeout(function () { root.classList.remove('arrive'); }, 200);
  })();
  (function () {
    if (location.hash.length > 2 || /[?&]preview/.test(location.search)) return;
    try {
      if (sessionStorage.getItem('ecem.world:intro')) return;
      sessionStorage.setItem('ecem.world:intro', '1');
    } catch (err) { /* storage blocked: play it anyway */ }
    var root = document.documentElement;
    root.classList.add('intro');
    // Never leave the page hidden, whatever fails.
    setTimeout(function () { root.classList.remove('intro'); }, 7000);
  })();
</script>

<script type="module">
  import { createScene } from '/assets/scene.js?v=20261124a';

  const root = document.documentElement;
  const stage = document.getElementById('stage');
  const mark = stage.parentElement;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // How far the large "e" is scaled down to sit in its corner.
  const fit = () => root.style.setProperty('--k', String(mark.clientWidth / stage.clientWidth));
  fit();
  window.addEventListener('resize', fit);

  const ready = createScene(stage).catch((err) => console.error('3D scene failed to start:', err));

  if (root.classList.contains('intro')) {
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Let the model load (but never wait on it for long), then let it be
    // seen large and drifting for a moment, as on the coming-soon page.
    await Promise.race([ready, wait(3500)]);
    await wait(still ? 0 : 1300);

    // Measure the large "e", switch to the finished layout, measure again,
    // then animate between the two (so the move lands exactly in place).
    const first = stage.getBoundingClientRect();
    root.classList.remove('intro');
    fit();
    const last = stage.getBoundingClientRect();
    if (!still) {
      const k = mark.clientWidth / stage.clientWidth;
      stage.animate([
        { transform: `translate(${first.left - last.left}px, ${first.top - last.top}px) scale(1)` },
        { transform: `scale(${k})` },
      ], { duration: 1300, easing: 'cubic-bezier(0.65, 0, 0.35, 1)' });
    }
  }
  // Once the "e" is in its corner, draw it at that size rather than large
  // and shrunk (see html.small in site.css): far less to render per frame.
  await Promise.all(stage.getAnimations().map((a) => a.finished.catch(() => {})));
  root.classList.add('small');
</script>

<script>
  // The corner logo leads back to the start: the page fades away around it,
  // and the home page carries the logo from this corner back to the middle.
  (function () {
    var mark = document.querySelector('.mark');
    if (!mark) return;
    mark.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();
      try { sessionStorage.setItem('ecem.world:return', String(Date.now())); } catch (err) { /* storage blocked */ }
      document.documentElement.classList.add('departing');
      var go = function () { location.href = mark.href; };
      // On a phone scrolled down, bring the logo back into view first.
      if (window.scrollY > 0 && innerWidth <= 860) { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(go, 700); }
      else setTimeout(go, 420);
    });
    // Leaving the portfolio any other way (the browser's Back button): note
    // the moment, so a home page loaded within a few seconds glides home too.
    addEventListener('pagehide', function () {
      try { if (!sessionStorage.getItem('ecem.world:return')) sessionStorage.setItem('ecem.world:return', String(Date.now())); } catch (err) { /* storage blocked */ }
    });
  })();
</script>

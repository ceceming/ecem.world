<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The front door of ecem.world: the logo, a line about Ecem beneath it, and
     the places to go, orbiting it. The portfolio feed is at /portfolio/. -->
<title>Ecem Öztürk — ecem.world</title>
<meta name="description" content="Ecem Öztürk — designer and art director, Toronto.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ecem Öztürk">
<meta property="og:description" content="Designer and art director, Toronto.">
<meta property="og:url" content="https://ecem.world/">
<script>
  // Links shared before the portfolio moved (ecem.world/#/a-project) still
  // land on that project.
  if (/^#\//.test(location.hash)) location.replace('/portfolio/' + location.hash);
  // The studio's Preview shows the portfolio; a studio tab opened before the
  // portfolio moved still asks for /?preview, so pass that along too (the
  // preview window keeps its link back to the studio).
  if (/[?&]preview/.test(location.search)) location.replace('/portfolio/' + location.search + location.hash);
</script>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/favicon.ico?v=2" sizes="32x32">

<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --ring: rgba(255, 255, 255, 0.22);
    --font: "Jost", Helvetica, Arial, sans-serif;
    --logo: 112px;             /* the "e" once it has settled in the middle */
    --big: min(64vmin, 560px); /* the "e" during the opening */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 400 13px/1.3 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }

  .sky { position: fixed; inset: 0; }

  /* The logo: large first, then it settles, smaller, in the very middle. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: var(--big); height: var(--big);
    transform: translate(-50%, -50%) scale(1);
    transition: transform 1400ms cubic-bezier(0.65, 0, 0.35, 1), left 1400ms cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 5;
  }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }
  .settled #stage { left: var(--lx, 50%); transform: translate(-50%, -50%) scale(var(--k, 0.2)); }
  /* Once settled, the logo is drawn at its real size instead of being drawn
     large and shrunk: far fewer pixels to render every frame, so the page
     stays smooth on phones. (Swapped in with no visible change.) */
  .small #stage { width: var(--logo); height: var(--logo); transform: translate(-50%, -50%) scale(1); }

  /* The line under the logo. It is always laid out at its settled size and
     place; during the opening it is carried, larger, to just under the big
     logo (--topen, worked out in script), and glides home as one piece, so
     the letters never re-flow or re-wrap mid-motion. */
  .title {
    position: absolute; left: var(--tl, 50%); top: calc(50% + var(--logo) / 2 + 6px);
    margin: 0; z-index: 6;
    font-size: 10px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
    width: max-content; max-width: 86vw; text-align: center; line-height: 1.5;
    padding-left: 0.2em;    /* balance the tracking after the last letter */
    transform-origin: 0 0; transform: var(--topen, none);
    transition: transform 1400ms cubic-bezier(0.65, 0, 0.35, 1), opacity 600ms ease;
  }
  .settled .title { transform: none; }

  /* The orbits: circles on tilting planes, traced in script, fading in one by one. */
  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  svg.rings path { fill: none; stroke: var(--ring); stroke-width: 1; opacity: 0; transition: opacity 900ms ease; }
  .settled svg.rings path { opacity: 1; }
  .settled svg.rings path:nth-child(2) { transition-delay: 180ms; }
  .settled svg.rings path:nth-child(3) { transition-delay: 360ms; }

  /* A point on an orbit, with its title right beside it, travelling with it.
     Point and title are one link. Behind the logo (the far half of an orbit)
     they dim and pass under it. */
  .body {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; gap: 10px;
    color: var(--fg); text-decoration: none;
    letter-spacing: 0.08em; text-transform: uppercase;
    opacity: 0; transition: opacity 700ms ease;
    will-change: transform;
    z-index: 8;
    padding: 8px;               /* a comfortable target for a finger */
  }
  .settled .body.on { opacity: var(--o, 1); }
  /* The two main destinations: highlighted, the text staying white. */
  /* Its colour drifts slowly round the spectrum, deep enough for white text. */
  .body.mark .label { background: var(--hl, rgba(15, 138, 60, 0.2)); padding: 2px 6px; }
  /* [ PORTFOLIO ]: the main door, set larger. */
  .body.big .label { font-size: 1.45em; }
  .body .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fg); flex: none; transition: transform 200ms ease; }
  .body .label { transition: opacity 200ms ease; }
  /* Titles on the left half read toward the middle from the left. */
  .body.flip { flex-direction: row-reverse; }
  .body.flip .label { text-align: right; }
  .body .label { width: max-content; }
  @media (hover: hover) {
    .body:hover { opacity: 1 !important; }
    .body:hover .dot { transform: scale(1.5); }
  }


  /* Phones held upright: once settled on the left, the line reads from the
     left edge under the logo, on two lines, rather than running off screen. */
  @media (max-aspect-ratio: 1/1.15) {
    .title { text-align: left; max-width: 136px; padding-left: 0; }
  }
  /* Phones held upright: [ PORTFOLIO ] sits in the middle, set larger still. */
  @media (max-aspect-ratio: 1/1.15) {
    .body.big .label { font-size: 2em; white-space: nowrap; }
  }
  @media (max-width: 600px) {
    :root { --logo: 84px; }
    body { font-size: 11px; }
    .body { gap: 7px; letter-spacing: 0.06em; }
    .body .dot { width: 7px; height: 7px; }
  }

  /* The essentials, always in plain sight above the orbit: four links, each
     on its own hairline, splitting the width evenly. They arrive with the
     orbit and leave with it. */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 12;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 14px;
    padding: 14px 16px 0;
    opacity: 0; transition: opacity 900ms ease 300ms;
  }
  .settled .top { opacity: 1; }
  .top a {
    border-top: 1px solid rgba(255, 255, 255, 0.55); padding: 7px 0 10px;
    color: var(--fg); text-decoration: none; text-transform: uppercase;
    letter-spacing: 0.12em; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color 200ms ease;
  }
  .top a:hover { border-top-color: #fff; }
  .top .short { display: none; }
  @media (max-width: 600px) {
    .top { gap: 0 10px; padding: 10px 12px 0; }
    .top a { font-size: 10px; letter-spacing: 0.08em; }
    .top .long { display: none; }
    .top .short { display: inline; }
  }
  .leaving .top { opacity: 0 !important; transition: opacity 380ms ease !important; }
  .no-anim .top { transition: none !important; }
  /* Leaving for the portfolio: everything else fades and the logo glides
     to its place in the portfolio's corner (see the [ PORTFOLIO ] link). */
  .leaving #stage { transition: left 900ms cubic-bezier(0.65, 0, 0.35, 1), top 900ms cubic-bezier(0.65, 0, 0.35, 1), transform 900ms cubic-bezier(0.65, 0, 0.35, 1); }
  .leaving .body, .leaving .title, .leaving svg.rings path { opacity: 0 !important; transition: opacity 380ms ease !important; }
  .no-anim #stage, .no-anim .title, .no-anim svg.rings path, .no-anim .body { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    #stage, .title, svg.rings path, .body { transition: none !important; }
  }
</style>
</head>
<body>

<nav class="top" aria-label="Main">
  <a href="/portfolio/">Portfolio</a>
  <a href="/freelance/"><span class="long">Freelance Services</span><span class="short">Freelance</span></a>
  <a href="/cv/">CV</a>
  <a href="mailto:hello@ecem.world">Contact</a>
</nav>

<main class="sky" aria-label="ecem.world">
  <div id="stage" aria-hidden="true"></div>
  <h1 class="title">Ecem is a creative in Toronto.</h1>
  <svg class="rings" aria-hidden="true"><path/><path/><path/></svg>
  <nav id="bodies" aria-label="Pages"></nav>
</main>

<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js" } }

<script type="module">
  import { createScene } from '/assets/scene.js?v=20261118a';

  /* ── What orbits where ─────────────────────────────────────────────
     ring: 0 innermost … 2 outermost. `at`: where the link stays on a phone,
     in degrees round its orbit (0 = straight right of the logo, -90 = up). */
  const BODIES = [
    { ring: 0, label: '[ PORTFOLIO ]', href: '/portfolio/', mark: true, big: true, at: -24 },
    { ring: 0, label: '[ I WILL DESIGN & SUPPLY YOUR MERCH ]', href: '/merch/', mark: true, at: 45 },
    { ring: 1, label: '[ INSTAGRAM ]', href: 'https://www.instagram.com/ecem.zip/', away: true, at: -74 },
    { ring: 1, label: '[ FREELANCE SERVICES ]', href: '/freelance/', mark: true, at: -42 },
    { ring: 2, label: '[ EMAIL ME ]', href: 'mailto:hello@ecem.world', at: 62 },
    { ring: 2, label: '[ CV ]', href: '/cv/', at: 40 },
    { ring: 2, label: '[ ME ]', href: '/portfolio/#/about', at: -40 },
  ];

  /* Each orbit: its radius as a share of the screen's shorter side (a
     phone held upright gets a little more), how many seconds one lap takes,
     and which way it turns. Inner orbits are quicker; all of them slow. */
  const RINGS = [
    { size: 0.17, phone: 0.25, lap: 240, dir: 1 },
    { size: 0.27, phone: 0.37, lap: 330, dir: -1 },
    { size: 0.37, phone: 0.48, lap: 440, dir: 1 },
  ];

  const root = document.documentElement;
  const sky = document.querySelector('.sky');
  const stage = document.getElementById('stage');
  const nav = document.getElementById('bodies');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The points and their titles. Spread evenly round each orbit, with the
  // orbits offset from one another so no two titles start stacked.
  const els = BODIES.map((b, i) => {
    const onRing = BODIES.filter((x) => x.ring === b.ring);
    const k = onRing.indexOf(b);
    b.phase = (k / onRing.length) * Math.PI * 2 + b.ring * 0.9 + 0.35;
    const a = document.createElement('a');
    a.className = 'body' + (b.mark ? ' mark' : '') + (b.big ? ' big' : '');
    a.href = b.href;
    if (b.away) { a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = `<span class="dot"></span><span class="label"></span>`;
    a.querySelector('.label').textContent = b.label;
    nav.appendChild(a);
    return a;
  });

  /* ── How the orbits move in depth ─────────────────────────────────
     Each orbit is a circle on its own plane, always tipped well back so the
     whole system reads in 3D: points come toward you (larger, brighter, over
     the logo) and recede (smaller, dimmer, behind it). On top of that, each
     plane sways a little, very slowly, on its own rhythm.
       tip:   how far each orbit leans back (radians), and to which side
       sway:  how much that lean drifts, forward/back and side to side
       period: seconds for one sway */
  const DEPTH = {
    tip:    [1.05, -0.95, 1.12],
    swing:  [0.28, -0.22, 0.12],
    sway:   { ax: 0.14, ay: 0.12 },
    period: [96, 124, 152],
  };
  // How far the phone's orbits tip while breathing (radians).
  const PHONE_BREATH = { ax: 0.22, ay: 0.3, period: [24, 31, 38] };
  // Sizes follow the screen; a phone held upright gets slightly larger orbits.
  let W, H, cx, cy, radii, F, tipScale = 1;
  /* On a phone held upright the orbits are seen side-on: their centre, and
     the logo, sit at the left edge of the screen; the orbits are large
     circles whose right halves sweep across the screen and run off its edges,
     and each link stays still at its own place on them. */
  let phone = false;
  function layout() {
    W = sky.clientWidth; H = sky.clientHeight; cx = W / 2; cy = H / 2;
    const portrait = H > W * 1.15;
    phone = portrait;
    if (phone) {
      const logoPx = parseFloat(getComputedStyle(root).getPropertyValue('--logo'));
      cx = Math.max(logoPx / 2 + 22, W * 0.17);
      radii = [0.24, 0.35, 0.44].map((f) => H * f);
      F = radii[2] * 3.2;
      root.style.setProperty('--lx', `${cx}px`);
      root.style.setProperty('--k', String(logoPx / stage.offsetWidth));
      return;
    }
    root.style.removeProperty('--lx');
    tipScale = portrait ? 0.72 : 1;   // upright phones: a little less tipped, so orbits keep some height
    const base = Math.min(W, H);
    radii = RINGS.map((r) => base * (portrait ? r.phone : r.size));
    F = radii[2] * 3.2;            // camera distance: how strong the perspective is
    root.style.setProperty('--k', String(parseFloat(getComputedStyle(root).getPropertyValue('--logo')) / stage.offsetWidth));
  }
  // The line under the logo: its settled place, and the larger place under
  // the big logo it starts from during the opening (see .title).
  const title = document.querySelector('.title');
  function placeTitle() {
    const w = title.offsetWidth;
    const left = phone ? 16 : W / 2 - w / 2;
    title.style.setProperty('--tl', `${left}px`);
    const s = 1.5, big = stage.offsetWidth;
    const dx = W / 2 - (w * s) / 2 - left;
    const dy = H / 2 + big / 2 + 14 - title.offsetTop;
    title.style.setProperty('--topen', `translate(${dx}px, ${dy}px) scale(${s})`);
  }
  addEventListener('resize', () => { layout(); placeTitle(); });
  layout();
  placeTitle();
  // The font arriving changes the line's width: place it again.
  if (document.fonts) document.fonts.ready.then(placeTitle);

  // A point at angle `a` on orbit k, at that orbit's moment `t`: tipped onto
  // its plane, then seen in perspective. Returns screen x, y, depth z
  // (positive = toward you) and the perspective scale.
  function project(k, a, t) {
    const per = phone ? PHONE_BREATH.period[k] : DEPTH.period[k];
    const ph = k * 2.1;
    // Phones: the orbits face you and only breathe — each slowly tips a
    // little toward and away from you, on its own rhythm, so the arcs swell
    // and settle in depth while the links keep their places on them.
    const tx = phone
      ? PHONE_BREATH.ax * Math.sin((2 * Math.PI * t) / per + ph)
      : DEPTH.tip[k] * tipScale + DEPTH.sway.ax * Math.sin((2 * Math.PI * t) / per + ph);
    const ty = phone
      ? PHONE_BREATH.ay * Math.sin((2 * Math.PI * t) / (per * 1.31) + ph * 1.7)
      : DEPTH.swing[k] + DEPTH.sway.ay * Math.sin((2 * Math.PI * t) / (per * 1.31) + ph * 1.7);
    const r = radii[k];
    let x = r * Math.cos(a), y = r * Math.sin(a), z = 0;
    // tip forward/back round the horizontal axis
    const y1 = y * Math.cos(tx), z1 = y * Math.sin(tx);
    // swing round the vertical axis
    const x2 = x * Math.cos(ty) + z1 * Math.sin(ty), z2 = -x * Math.sin(ty) + z1 * Math.cos(ty);
    const s = F / (F - z2);
    return { x: cx + x2 * s, y: cy + y1 * s, z: z2, s };
  }

  // Motion: each orbit keeps its own clock; hovering a title holds its orbit
  // (turning and tilting) still so it is easy to click.
  let last = null;
  const held = new Set();
  els.forEach((el, i) => {
    el.addEventListener('mouseenter', () => held.add(BODIES[i].ring));
    el.addEventListener('mouseleave', () => held.delete(BODIES[i].ring));
  });
  const ringT = RINGS.map(() => 0);
  let clock = 0;
  function tick(now) {
    if (last !== null) {
      const dt = Math.min((now - last) / 1000, 0.05);
      if (!still) RINGS.forEach((_, k) => { if (!held.has(k)) ringT[k] += dt; });
      clock += dt;
    }
    last = now;
    draw();
    requestAnimationFrame(tick);
  }

  function draw() {
    // The orbits themselves, traced through their tilted planes.
    paths.forEach((path, k) => {
      let d = '';
      for (let n = 0; n <= 96; n++) {
        const q = project(k, (n / 96) * Math.PI * 2, ringT[k]);
        d += (n ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1);
      }
      path.setAttribute('d', d + 'Z');
    });
    // The highlight's colour: a slow, subtle drift round the spectrum.
    const hue = (140 + clock * 2.4) % 360;   // one round of colours in about 2½ minutes
    BODIES.forEach((b, i) => {
      const r = RINGS[b.ring];
      const ang = phone ? (b.at * Math.PI) / 180 : b.phase + (r.dir * ringT[b.ring] * Math.PI * 2) / r.lap;
      const q = project(b.ring, ang, ringT[b.ring]);
      const el = els[i];
      // Titles run outward from the middle, away from the logo. If that side
      // of the screen is short of room they wrap onto more lines; only when
      // there is really no room do they cross to the other side.
      const label = el.lastElementChild;
      const edge = 12, gap = 28;
      const outward = q.x >= cx ? W - edge - q.x - gap : q.x - edge - gap;
      const inward = q.x >= cx ? q.x - edge - gap : W - edge - q.x - gap;
      // A title crosses to the other side only if it can't fit outward even
      // when wrapped (short titles need only their own width).
      label.style.maxWidth = 'none';
      const need = Math.min(label.offsetWidth, 110);
      // Some resistance, so a title near the edge doesn't flick from side to
      // side as its orbit breathes: once crossed, it needs clear room to come back.
      const cross = el.dataset.cross === '1' ? outward < need + 36 : outward < need - 4;
      el.dataset.cross = cross ? '1' : '0';
      const flip = (q.x < cx) !== cross;
      label.style.maxWidth = `${Math.max(60, Math.floor(cross ? inward : outward))}px`;
      el.classList.toggle('flip', flip);
      // The dot's own centre sits exactly on the orbit; nearer points are
      // drawn larger and brighter, further ones smaller, dimmer and, once
      // they are behind the middle, underneath the logo.
      const dot = el.firstElementChild;
      const dx = dot.offsetLeft + dot.offsetWidth / 2;
      const dy = dot.offsetTop + dot.offsetHeight / 2;
      const s = Math.max(0.7, Math.min(1.35, q.s));
      el.style.transform = `translate(${q.x}px, ${q.y}px) scale(${s.toFixed(3)}) translate(${-dx}px, ${-dy}px)`;
      const depth = Math.max(-1, Math.min(1, q.z / radii[2]));
      el.style.setProperty('--o', Math.min(1, (phone ? 0.92 : 0.82) + depth * 0.4).toFixed(3));
      el.style.zIndex = q.z < 0 ? 2 : 8;
      if (b.mark) {
        const h1 = (hue + i * 22) % 360, h2 = (h1 + 70) % 360;
        el.style.setProperty('--hl', `linear-gradient(90deg, hsl(${h1} 85% 55% / 0.2), hsl(${h2} 85% 55% / 0.2))`);
      }
    });
  }
  const paths = [...document.querySelectorAll('svg.rings path')];
  draw();
  requestAnimationFrame(tick);

  // Into the portfolio: the logo travels to where the portfolio keeps it
  // (top left: 92px on wide screens, 79px on phones), the rest fades away,
  // then the portfolio opens around it.
  // Draw the settled logo at its real size (see .small). Only once it has
  // stopped moving: the swap is invisible at rest, not mid-glide.
  function drawSmall() {
    root.classList.add('no-anim', 'small');
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('no-anim')));
  }
  function afterGlide(fn) {
    let done = false;
    const finish = () => { if (done) return; done = true; stage.removeEventListener('transitionend', onEnd); fn(); };
    const onEnd = (e) => { if (e.target === stage && e.propertyName === 'transform') finish(); };
    stage.addEventListener('transitionend', onEnd);
    setTimeout(finish, 4000);   // in case no transition ran at all
  }
  function toCorner() {
    const wide = innerWidth > 860;
    const size = wide ? 92 : 79, left = wide ? 4 : 0, top = wide ? 8 : 4;
    stage.style.left = `${left + size / 2}px`;
    stage.style.top = `${top + size / 2}px`;
    stage.style.transform = `translate(-50%, -50%) scale(${size / stage.offsetWidth})`;
  }
  // Back from the portfolio: the logo, starting in the portfolio's corner,
  // glides back to the middle, then the orbits, links and title fade in.
  function comeHome() {
    stage.style.left = stage.style.top = stage.style.transform = '';
    setTimeout(() => root.classList.remove('leaving'), 900);
  }
  const portfolioLink = els[BODIES.findIndex((b) => b.href === '/portfolio/')];
  portfolioLink.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || still) return;
    e.preventDefault();
    root.classList.add('leaving');
    toCorner();
    try { sessionStorage.setItem('ecem.world:arrive', '1'); } catch (err) { /* storage blocked */ }
    setTimeout(() => { location.href = portfolioLink.href; }, 920);
  });
  // Coming back with the browser's Back button to this same page (kept in
  // memory, still in its "leaving" state): play the way out in reverse.
  addEventListener('pageshow', (e) => {
    if (!e.persisted || !root.classList.contains('leaving')) return;
    comeHome();
  });

  // The opening: the logo large on black, then it settles in the middle, the
  // orbits draw in, and the points arrive one by one.
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const ready = createScene(stage).catch((err) => console.error('3D scene failed to start:', err));
  let seen = false, returning = false;
  try { seen = !!sessionStorage.getItem('ecem.world:intro'); sessionStorage.setItem('ecem.world:intro', '1'); } catch (e) { /* storage blocked */ }
  if (!seen) {
    await Promise.race([ready, wait(3500)]);
    await wait(still ? 0 : 1100);
  } else {
    // Coming back: no opening. From the portfolio's logo, the logo starts in
    // the portfolio's corner and glides home; otherwise straight to the
    // settled view.
    try {
      // Only a fresh note counts: straight back from the portfolio, not a
      // visit to the CV or elsewhere first.
      returning = Date.now() - Number(sessionStorage.getItem('ecem.world:return') || 0) < 5000;
      sessionStorage.removeItem('ecem.world:return');
    } catch (e) { /* storage blocked */ }
    root.classList.add('no-anim');
    if (returning && !still) { root.classList.add('leaving'); toCorner(); }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      root.classList.remove('no-anim');
      if (returning && !still) comeHome();
    }));
  }
  root.classList.add('settled');
  // When the logo has finished moving, swap it to drawing at its real size.
  if (still || (seen && !returning)) drawSmall();
  else afterGlide(drawSmall);
  els.forEach((el, i) => setTimeout(() => el.classList.add('on'), still || seen ? 0 : 900 + i * 140));
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ecem.world</title>
<meta name="description" content="Ecem Öztürk — portfolio. Coming soon.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="ecem.world">
<meta property="og:description" content="Coming soon.">
<meta property="og:url" content="https://ecem.world/">

<style>
  :root {
    color-scheme: dark;

    /* ── The one size knob ────────────────────────────────────────────
       How much room the glyph gets on the page. The gap to "coming soon"
       follows from it, so raise this for a bigger glyph and lower it for a
       smaller one and the spacing keeps itself. */
    --stage: min(42vmin, 205px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }

  body {
    /* Helvetica where it exists, with sane stand-ins everywhere else. */
    font-family: Helvetica, "Helvetica Neue", "HelveticaNeue", Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-block: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 600px;
    opacity: 0;
    transition: opacity 900ms ease;
  }

  body.ready main,
  body.ready footer { opacity: 1; }

  /* Pinned to the window rather than sitting in the flow, so adding it does
     not shift the glyph off the centre it was framed on. */
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(24px, env(safe-area-inset-bottom));
    padding-inline: 24px;
    text-align: center;
    opacity: 0;
    transition: opacity 900ms ease;
  }

  footer p {
    margin: 0 auto;
    max-width: 30em;
    /* Same face and size as "coming soon" — but nowhere near its 0.42em
       tracking, which is fine across two words and unreadable across a
       sentence. */
    font-size: clamp(12px, 2.7vmin, 16px);
    letter-spacing: 0.12em;
    line-height: 2;
    text-wrap: balance;
  }

  footer a {
    color: inherit;
    text-decoration: none;
    /* A hairline, so it reads as tappable without shouting. */
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    padding-bottom: 2px;
    white-space: nowrap;   /* never break an address across lines */
    transition: border-color 250ms ease;
  }

  footer a:hover,
  footer a:focus-visible { border-bottom-color: #fff; }

  /* On a narrow phone the line fits, but only just — and a wider fallback
     face than Helvetica would tip it into wrapping. Buy back the room from
     the tracking rather than the type size. */
  @media (max-width: 430px) {
    footer p { letter-spacing: 0.07em; }
  }

  /* The 3D object sits on a fully transparent canvas, so the black page
     shows straight through it. */
  #stage {
    width: var(--stage);
    aspect-ratio: 1 / 1;
    position: relative;
  }

  #stage canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    background: transparent;
  }

  h1 {
    /* The glyph is centred in its canvas, so this is an ordinary gap. */
    margin: calc(var(--stage) * 0.05) 0 0;
    font-size: clamp(12px, 2.7vmin, 16px);
    font-weight: 400;
    letter-spacing: 0.42em;
    /* letter-spacing adds a trailing gap; nudge back so it reads centred */
    text-indent: 0.42em;
    text-transform: lowercase;
    white-space: nowrap;
  }

  /* Uncomment to put your name above the object.
  .name {
    font-size: clamp(12px, 2.4vmin, 15px);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    opacity: 0.55;
    margin: 0;
  }
  */

  @media (prefers-reduced-motion: reduce) {
    main, footer { transition: none; }
  }
</style>
</head>
<body>

<main>
  <!-- <p class="name">ecem öztürk</p> -->
  <div id="stage" aria-hidden="true"></div>
  <h1>coming soon</h1>
</main>

<footer>
  <p>in the meantime, contact me at
    <a href="mailto:hello@ecem.world">hello@ecem.world</a></p>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>

<script type="module">
  import { createScene } from './assets/scene.js';

  const reveal = () => document.body.classList.add('ready');

  createScene(document.getElementById('stage'))
    .then(reveal)
    .catch((err) => {
      // Never leave a blank page: if WebGL is unavailable the words still show.
      console.error('3D scene failed to start:', err);
      reveal();
    });
</script>

</body>
</html>
